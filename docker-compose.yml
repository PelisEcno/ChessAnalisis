services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peonlibre
      POSTGRES_PASSWORD: peonlibre
      POSTGRES_DB: peonlibre
    ports:
      # 5433 en el host: 5432 ya está ocupado por otro proyecto en esta máquina.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peonlibre"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgres://peonlibre:peonlibre@postgres:5432/peonlibre
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    command: ["apps/api/node_modules/.bin/tsx", "apps/api/src/db/migrate.ts"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env
    environment:
      DATABASE_URL: postgres://peonlibre:peonlibre@postgres:5432/peonlibre
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
